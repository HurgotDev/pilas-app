<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pilas · mascot playground</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px; background: #12131a;
             color: #eef0f7; font-family: ui-rounded, system-ui, sans-serif; }
      .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid #3a3e52; background: none;
               color: inherit; cursor: pointer; }
      pilas-mascot { height: 240px; }
    </style>
  </head>
  <body>
    <main>
      <pilas-mascot id="m" state="working"></pilas-mascot>
      <div class="row">
        <button data-s="sleeping">Sleeping</button><button data-s="working">Working</button>
        <button data-s="alert">Alert</button><button data-s="full">Full</button>
      </div>
      <div class="row" id="skins"></div>
      <div class="row">
        <button data-r="wave">Wave</button><button data-r="squish">Squish</button>
        <button data-r="dizzy">Dizzy</button>
      </div>
      <div class="row">
        <button data-snd="alert">♪ alert</button><button data-snd="done">♪ done</button>
        <button data-snd="approved">♪ approved</button><button data-snd="denied">♪ denied</button>
        <button data-snd="tap">♪ tap</button>
      </div>
    </main>
    <script type="module">
      import "./src/mascot/pilita.ts";
      import { play } from "./src/sound/sfx.ts";
      import { SKINS } from "./src/skins/index.ts";
      import { t } from "./src/i18n.ts";
      document.getElementById("skins").innerHTML = Object.values(SKINS)
        .map((k) => `<button data-k="${k.id}">${t(k.label)}</button>`).join("");
      const m = document.getElementById("m");
      document.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => (m.state = b.dataset.s)));
      document.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => (m.skin = b.dataset.k)));
      document.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => m.react(b.dataset.r)));
      document.querySelectorAll("[data-snd]").forEach((b) => (b.onclick = () => play(b.dataset.snd)));
    </script>
  </body>
</html>
