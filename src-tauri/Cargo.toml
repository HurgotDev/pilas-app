[package]
name = "pilas"
description = "Pilas: la pilita del notch que te avisa cuando Claude Code te necesita"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pilas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
pilas-core = { path = "../crates/pilas-core" }
pilas-jump = { path = "../crates/pilas-jump" }
libc = "0.2"

# Panel del notch (src-tauri/src/panel.rs): bindings de AppKit ya presentes en Cargo.lock vía Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSPanel", "NSScreen", "NSTrackingArea", "NSView", "NSWindow"] }
