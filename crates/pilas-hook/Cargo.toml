[package]
name = "pilas-hook"
description = "Claude Code hook for Pilas: stdin → socket → stdout. Never blocks Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pilas-core = { path = "../pilas-core" }
serde_json.workspace = true
uuid.workspace = true

# find_tty on macOS reads the ancestors' TTY without spawning `ps`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
