[package]
name = "pilas-hook"
description = "Hook de Claude Code para Pilas: stdin → socket → stdout. Nunca bloquea a Claude Code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pilas-core = { path = "../pilas-core" }
serde_json.workspace = true
uuid.workspace = true

# find_tty en macOS lee el TTY de los procesos ancestros sin lanzar `ps`.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
