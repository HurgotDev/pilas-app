name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # tauri::generate_context! necesita dist/ en tiempo de compilación.
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test -p pilas-core -p pilas-hook -p pilas-jump -p pilas

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:scripts

  # Check requerido: corre en cada evento; la lógica por rama vive en el step.
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check branch and release policy
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/release.mjs check
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: only fragments are checked."
            exit 0
          fi
          fail=0
          fragments() { find .changes -maxdepth 1 -name '*.md' ! -name README.md; }

          case "$BASE" in
            main)
              if [[ "$HEAD" != release/* ]] && [[ "$HEAD" != hotfix/* ]]; then
                echo "::error::PRs into main must come from release/* or hotfix/*, not '$HEAD'."
                fail=1
              fi
              if [ -n "$(fragments)" ]; then
                echo "::error::.changes/ still has fragments. Run 'npm run release:prepare' on your release or hotfix branch before opening the PR."
                fail=1
              fi
              head_version=$(node scripts/release.mjs version)
              main_version=$(git show origin/main:src-tauri/tauri.conf.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
              highest=$(printf '%s\n%s\n' "$main_version" "$head_version" | sort -V | tail -n1)
              # Misma versión: solo fragmentos "none", no se publica release.
              if [ "$head_version" = "$main_version" ]; then
                echo "::notice::Version unchanged ($head_version): merging will not publish a release."
              elif [ "$highest" != "$head_version" ]; then
                echo "::error::Version $head_version must not be lower than main's $main_version. Run 'npm run release:prepare'."
                fail=1
              elif ! node scripts/release.mjs notes "$head_version" > /dev/null 2>&1; then
                echo "::error::CHANGELOG.md has no section for $head_version."
                fail=1
              fi
              ;;
            develop)
              # Release PRs go to main; the only PR into develop exempt from
              # fragments is the automatic back-merge from main.
              if [ "$HEAD" = "main" ]; then
                echo "Back-merge PR from main: no fragment required."
              else
                added=$(git diff --name-only --diff-filter=A origin/develop...HEAD)
                # grep -c lee toda la entrada: sin SIGPIPE bajo pipefail.
                count=$(printf '%s\n' "$added" | grep -E '^\.changes/[^/]+\.md$' | grep -cv '^\.changes/README\.md$' || true)
                if [ "$count" -eq 0 ]; then
                  echo "::error::PRs into develop need a changelog fragment in .changes/<slug>.md, written in English (see .changes/README.md)."
                  fail=1
                fi
              fi
              ;;
            *)
              echo "Base '$BASE' has no extra rules."
              ;;
          esac
          exit "$fail"
