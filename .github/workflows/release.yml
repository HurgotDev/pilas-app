name: Release

# Cada push a main es un release; workflow_dispatch solo deja el .dmg como artefacto.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node scripts/release.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: cargo build -p pilas-hook --release --target aarch64-apple-darwin
      - run: cargo build -p pilas-hook --release --target x86_64-apple-darwin
      - name: Create universal pilas-hook
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/pilas-hook \
            target/aarch64-apple-darwin/release/pilas-hook \
            target/x86_64-apple-darwin/release/pilas-hook
          codesign --force --sign - target/universal-apple-darwin/release/pilas-hook

      - name: Build universal app
        run: |
          npx tauri build --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","files":{"MacOS/pilas-hook":"../target/universal-apple-darwin/release/pilas-hook"}}}}'

      - name: Verify architectures and signature
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Pilas.app
          for bin in "$app/Contents/MacOS/pilas" "$app/Contents/MacOS/pilas-hook"; do
            archs=$(lipo -archs "$bin" | tr ' ' '\n' | sort | xargs)
            if [ "$archs" != "arm64 x86_64" ]; then
              echo "::error::${bin} has architectures: ${archs}"
              exit 1
            fi
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Upload dmg artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pilas-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Pilas $VERSION" \
            --notes-file notes.md target/universal-apple-darwin/release/bundle/dmg/*.dmg
