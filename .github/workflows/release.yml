name: Release

# Cada push a main es un release; workflow_dispatch solo deja los artefactos para probar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(node scripts/release.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the updater signing key
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY: updates cannot be signed without it. See docs/RELEASING.md."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: cargo build -p pilas-hook --release --target aarch64-apple-darwin
      - run: cargo build -p pilas-hook --release --target x86_64-apple-darwin
      - name: Create universal pilas-hook
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/pilas-hook \
            target/aarch64-apple-darwin/release/pilas-hook \
            target/x86_64-apple-darwin/release/pilas-hook
          codesign --force --sign - target/universal-apple-darwin/release/pilas-hook

      - name: Build universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-","files":{"MacOS/pilas-hook":"../target/universal-apple-darwin/release/pilas-hook"}}}}'

      - name: Verify architectures and signature
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Pilas.app
          for bin in "$app/Contents/MacOS/pilas" "$app/Contents/MacOS/pilas-hook"; do
            archs=$(lipo -archs "$bin" | tr ' ' '\n' | sort | xargs)
            if [ "$archs" != "arm64 x86_64" ]; then
              echo "::error::${bin} has architectures: ${archs}"
              exit 1
            fi
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      # Nombre estable: el endpoint de latest.json apunta a Pilas_universal.app.tar.gz.
      - name: Rename updater artifacts
        run: |
          macos=target/universal-apple-darwin/release/bundle/macos
          mv "$macos/Pilas.app.tar.gz" "$macos/Pilas_universal.app.tar.gz"
          mv "$macos/Pilas.app.tar.gz.sig" "$macos/Pilas_universal.app.tar.gz.sig"

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pilas-release
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/Pilas_universal.app.tar.gz

      - name: Generate latest.json
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release.mjs latest "$VERSION" \
            target/universal-apple-darwin/release/bundle/macos/Pilas_universal.app.tar.gz.sig > latest.json

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/release.mjs notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Pilas $VERSION" \
            --notes-file notes.md \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/macos/Pilas_universal.app.tar.gz \
            latest.json

  cask:
    needs: [check, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the cask with the published dmg
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          curl -fsSL -o Pilas.dmg \
            "https://github.com/HurgotDev/pilas-app/releases/download/v${VERSION}/Pilas_${VERSION}_universal.dmg"
          node scripts/release.mjs cask "$VERSION" Pilas.dmg > pilas.rb
          ruby -c pilas.rb

      - name: Publish the cask to homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::Missing secret HOMEBREW_TAP_TOKEN: the cask is not updated in homebrew-tap."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/HurgotDev/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp pilas.rb tap/Casks/pilas.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pilas.rb
          if git diff --cached --quiet; then
            echo "Cask already at $VERSION."
            exit 0
          fi
          git commit -m "Update pilas cask to $VERSION"
          git push origin HEAD:main

  # Back-merge main -> develop por PR. Solo corre tras un release real (needs
  # release con éxito). Usa BACKMERGE_TOKEN: los PRs abiertos con GITHUB_TOKEN
  # no disparan CI y el check policy nunca correría.
  backmerge:
    needs: [check, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BACKMERGE_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Back-merge main into develop
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Missing secret BACKMERGE_TOKEN: main is not back-merged into develop after $VERSION. See docs/RELEASING.md."
            exit 0
          fi
          git fetch --quiet origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main: nothing to back-merge."
            exit 0
          fi
          pr=$(gh pr list --base develop --head main --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            body="Automatic back-merge after release $VERSION.

          Merge it with a merge commit, not a squash, so develop keeps the
          release commits from main."
            url=$(gh pr create --base develop --head main \
              --title "Back-merge main into develop after $VERSION" --body "$body")
            pr=$(gh pr view "$url" --json number --jq .number)
          fi
          # Se fusiona cuando el repo lo permita (Allow auto-merge) y pasen los checks.
          gh pr merge "$pr" --auto --merge
